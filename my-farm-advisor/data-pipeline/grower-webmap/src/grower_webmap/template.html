<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grower field map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b1220;
    color: #e2e8f0;
  }
  #app { display: flex; height: 100vh; }
  #sidebar {
    flex: 0 0 300px;
    width: 300px;
    display: flex;
    flex-direction: column;
    background: #0f172a;
    border-right: 1px solid #1e293b;
  }
  header { padding: 16px 16px 8px; }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #7dd3fc;
  }
  h1 { margin: 0; font-size: 18px; line-height: 1.25; }
  .meta { margin: 6px 0 0; font-size: 12px; color: #94a3b8; }
  .toolbar { padding: 8px 16px 12px; }
  button { font: inherit; }
  #fit-all {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    cursor: pointer;
  }
  #fit-all:hover { background: #273449; }
  .field-list { flex: 1 1 auto; overflow-y: auto; padding: 0 8px 12px; }
  .field-list section { margin-bottom: 12px; }
  .field-list h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #94a3b8;
  }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
  .state { color: #64748b; font-weight: 500; }
  .field-list ul { list-style: none; margin: 0; padding: 0; }
  .field-button {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #e2e8f0;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  .field-button:hover, .field-button:focus-visible { background: #1e293b; outline: none; }
  .field-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field-area { color: #94a3b8; font-variant-numeric: tabular-nums; white-space: nowrap; }
  footer {
    padding: 10px 16px 14px;
    border-top: 1px solid #1e293b;
    font-size: 11px;
    color: #64748b;
  }
  footer p { margin: 0; }
  main { position: relative; flex: 1 1 auto; }
  #map { position: absolute; inset: 0; background: #111827; }
  .leaflet-popup-content { color: #0f172a; }
  .popup h2 { margin: 0 0 8px; font-size: 15px; }
  .popup dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 12px; }
  .popup dt { color: #64748b; }
  .popup dd { margin: 0; font-weight: 500; }
  .empty { padding: 16px; font-size: 13px; color: #94a3b8; }
  .noscript { padding: 16px; }
  @media (max-width: 720px) {
    #app { flex-direction: column-reverse; }
    #sidebar {
      flex: 0 0 45%;
      width: 100%;
      border-right: 0;
      border-top: 1px solid #1e293b;
    }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <p class="eyebrow">My Farm Advisor</p>
      <h1 id="grower-name">Grower</h1>
      <p class="meta" id="grower-meta"></p>
    </header>
    <div class="toolbar">
      <button type="button" id="fit-all">Fit all fields</button>
    </div>
    <div class="field-list" id="field-list"></div>
    <footer>
      <p>Basemap: ESRI World Imagery (toggle to OpenStreetMap). Field boundaries are read from the pipeline output (WGS84).</p>
    </footer>
  </aside>
  <main>
    <div id="map" aria-label="Grower field map"></div>
  </main>
</div>
<noscript><p class="noscript">This map needs JavaScript enabled.</p></noscript>
<script id="grower-map-data" type="application/json">__GROWER_MAP_DATA__</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("grower-map-data").textContent);
  var imagery = DATA.basemaps.imagery;
  var osm = DATA.basemaps.osm;

  function esc(value) {
    return String(value === null || value === undefined ? "" : value).replace(
      /[&<>"']/g,
      function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      }
    );
  }

  function plural(count, singular) {
    return count + " " + singular + (count === 1 ? "" : "s");
  }

  document.title = DATA.grower.name + " field map";
  document.getElementById("grower-name").textContent = DATA.grower.name;
  document.getElementById("grower-meta").textContent = [
    plural(DATA.meta.farmCount, "farm"),
    plural(DATA.meta.fieldCount, "field")
  ].join(" \u00b7 ");

  var map = L.map("map", { zoomControl: true, scrollWheelZoom: true, worldCopyJump: true });
  var imageryLayer = L.tileLayer(imagery.url, {
    maxZoom: imagery.maxZoom,
    attribution: imagery.attribution
  });
  var osmLayer = L.tileLayer(osm.url, {
    maxZoom: osm.maxZoom,
    attribution: osm.attribution
  });
  imageryLayer.addTo(map);
  L.control.layers(
    { "ESRI World Imagery": imageryLayer, "OpenStreetMap": osmLayer },
    null,
    { position: "topright", collapsed: true }
  ).addTo(map);
  L.control.scale({ imperial: true, metric: true, position: "bottomleft" }).addTo(map);

  var allBounds = L.latLngBounds([]);
  var layersById = {};
  var activeFieldId = null;

  function resetStyle(layer) {
    layer.setStyle(layer.baseStyle || { weight: 2, fillOpacity: 0.18 });
  }

  function setActive(fieldId) {
    if (activeFieldId && layersById[activeFieldId]) {
      resetStyle(layersById[activeFieldId]);
    }
    activeFieldId = fieldId;
    var layer = layersById[fieldId];
    if (!layer) return;
    layer.setStyle({ weight: 4, fillOpacity: 0.34 });
    if (layer.bringToFront) layer.bringToFront();
  }

  function popupHtml(props) {
    var rows = [
      ["Grower", DATA.grower.name],
      ["Farm", props.farm_name],
      ["Field", props.field_name],
      ["Field ID", props.field_id],
      ["Area", props.area_acres === null || props.area_acres === undefined ? "n/a" : props.area_acres + " ac"],
      ["County", props.county_name || "n/a"],
      ["Boundary", props.source || "n/a"]
    ];
    var html = '<div class="popup"><h2>' + esc(props.field_name) + "</h2><dl>";
    rows.forEach(function (row) {
      html += "<dt>" + esc(row[0]) + "</dt><dd>" + esc(row[1]) + "</dd>";
    });
    return html + "</dl></div>";
  }

  DATA.farms.forEach(function (farm) {
    var features = DATA.fields.filter(function (feature) {
      return feature.properties.farm_slug === farm.slug;
    });
    if (!features.length) return;

    var baseStyle = {
      color: farm.color,
      weight: 2,
      opacity: 0.95,
      fillColor: farm.color,
      fillOpacity: 0.18
    };

    L.geoJSON(
      { type: "FeatureCollection", features: features },
      {
        style: function () { return baseStyle; },
        onEachFeature: function (feature, layer) {
          var props = feature.properties;
          layersById[props.field_id] = layer;
          layer.baseStyle = baseStyle;
          layer.bindPopup(popupHtml(props), { maxWidth: 320 });
          layer.on("click", function () { setActive(props.field_id); });
          layer.on("mouseover", function () { layer.setStyle({ weight: 3 }); });
          layer.on("mouseout", function () {
            if (activeFieldId !== props.field_id) resetStyle(layer);
          });
          if (layer.getBounds) allBounds.extend(layer.getBounds());
        }
      }
    ).addTo(map);
  });

  var listHost = document.getElementById("field-list");
  if (!DATA.fields.length) {
    var empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "No field boundaries found for this grower.";
    listHost.appendChild(empty);
  }

  DATA.farms.forEach(function (farm) {
    var features = DATA.fields.filter(function (feature) {
      return feature.properties.farm_slug === farm.slug;
    });
    if (!features.length) return;

    var section = document.createElement("section");
    var heading = document.createElement("h2");
    heading.innerHTML =
      '<span class="swatch" style="background:' + esc(farm.color) + '"></span>' +
      esc(farm.name) +
      (farm.state ? ' <span class="state">' + esc(farm.state) + "</span>" : "");
    section.appendChild(heading);

    var list = document.createElement("ul");
    features.forEach(function (feature) {
      var props = feature.properties;
      var item = document.createElement("li");
      var button = document.createElement("button");
      button.type = "button";
      button.className = "field-button";
      button.innerHTML =
        '<span class="field-name">' + esc(props.field_name) + "</span>" +
        '<span class="field-area">' +
        (props.area_acres === null || props.area_acres === undefined
          ? ""
          : esc(props.area_acres) + " ac") +
        "</span>";
      button.addEventListener("click", function () { focusField(props.field_id); });
      item.appendChild(button);
      list.appendChild(item);
    });
    section.appendChild(list);
    listHost.appendChild(section);
  });

  function focusField(fieldId) {
    var layer = layersById[fieldId];
    if (!layer) return;
    setActive(fieldId);
    map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 17 });
    layer.openPopup();
  }

  document.getElementById("fit-all").addEventListener("click", function () {
    if (allBounds.isValid()) map.fitBounds(allBounds, { padding: [30, 30] });
  });

  if (allBounds.isValid()) {
    map.fitBounds(allBounds, { padding: [30, 30] });
  } else {
    map.setView([39.5, -98.35], 4);
  }
})();
</script>
</body>
</html>
